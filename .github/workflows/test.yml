name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux SDK build and media prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libgirepository1.0-dev pkg-config python3-dev portaudio19-dev libsndfile1 libgl1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: ruff check ducky_reachy_mini tests scripts
      - run: python -m build
      - run: python scripts/check_release.py
  network:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s components/network-relay/tests -v
      - run: python components/network-relay/relay.py --config components/network-relay/config/config.example.json --check-config
